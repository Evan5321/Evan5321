<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Evan Lai — code, data, AI">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.55" stop-color="#080d18"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="haloCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2536" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes blink { 0%, 45% { opacity: 1; } 55%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes dash { to { stroke-dashoffset: -220; } }
      .a1 { animation: rise .9s cubic-bezier(.2,.7,.2,1) .1s both; }
      .a2 { animation: rise .9s cubic-bezier(.2,.7,.2,1) .3s both; }
      .a3 { animation: rise .9s cubic-bezier(.2,.7,.2,1) .5s both; }
      .a4 { animation: slideIn .8s cubic-bezier(.2,.7,.2,1) .7s both; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .node { animation: pulse 3.6s ease-in-out infinite; }
      .float { animation: float 8s ease-in-out infinite; }
      .flow { stroke-dasharray: 4 10; animation: dash 9s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .a1, .a2, .a3, .a4, .cursor, .node, .float, .flow { animation: none !important; }
        .a1, .a2, .a3, .a4 { opacity: 1 !important; }
      }
    </style>
  </defs>

  <rect width="1280" height="300" fill="url(#sky)"/>
  <rect width="1280" height="300" fill="url(#grid)" opacity="0.5"/>
  <ellipse cx="1040" cy="70" rx="340" ry="210" fill="url(#haloCyan)"/>
  <ellipse cx="150" cy="270" rx="300" ry="190" fill="url(#haloViolet)"/>

  <!-- left: identity -->
  <g class="a1">
    <circle cx="72" cy="86" r="5" fill="#22d3ee"/>
    <circle cx="72" cy="86" r="12" fill="none" stroke="#22d3ee" stroke-opacity="0.45">
      <animate attributeName="r" values="7;17;7" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.55;0;0.55" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="96" y="92" class="mono" font-size="12" letter-spacing="3" fill="#7d8ba3">PROFILE v2026</text>
  </g>

  <text class="a2 sans" x="68" y="166" font-size="66" font-weight="800" letter-spacing="1" fill="#e6edf7">EVAN LAI</text>

  <g class="a3">
    <rect x="70" y="188" width="118" height="3" rx="1.5" fill="url(#accent)"/>
    <text class="sans" x="70" y="222" font-size="17" fill="#9fb0c9" letter-spacing="0.5">全栈工程 · AI 应用 · 数据与机器学习</text>
  </g>

  <g class="a4">
    <rect x="70" y="246" width="470" height="30" rx="6" fill="#0d1524" stroke="#1b2536"/>
    <circle cx="86" cy="261" r="3.5" fill="#22d3ee" opacity="0.9"/>
    <text class="mono" x="100" y="266" font-size="12.5" fill="#22d3ee">$ echo</text>
    <text class="mono" x="162" y="266" font-size="12.5" fill="#c9d6ea">"build things that actually work"</text>
    <rect class="cursor" x="450" y="254" width="7" height="14" fill="#22d3ee"/>
  </g>

  <!-- right: minimal node network -->
  <g opacity="0.95">
    <g stroke="#1f3550" stroke-width="1" fill="none">
      <path class="flow" d="M960 96 L1074 148 L996 210"/>
      <path d="M1074 148 L1188 104"/>
      <path d="M996 210 L1112 240"/>
      <path d="M1188 104 L1112 240" stroke="#233a57"/>
      <path d="M960 96 L1140 66" stroke="#233a57"/>
    </g>
    <g class="node">
      <circle cx="960" cy="96" r="5" fill="#22d3ee"/>
      <circle cx="960" cy="96" r="13" fill="none" stroke="#22d3ee" stroke-opacity="0.35"/>
    </g>
    <g class="node" style="animation-delay:.7s">
      <circle cx="1074" cy="148" r="6" fill="#38bdf8"/>
      <circle cx="1074" cy="148" r="15" fill="none" stroke="#38bdf8" stroke-opacity="0.3"/>
    </g>
    <g class="node" style="animation-delay:1.3s">
      <circle cx="996" cy="210" r="4.5" fill="#a78bfa"/>
      <circle cx="996" cy="210" r="12" fill="none" stroke="#a78bfa" stroke-opacity="0.35"/>
    </g>
    <g class="node" style="animation-delay:1.9s">
      <circle cx="1188" cy="104" r="4" fill="#4ade80"/>
    </g>
    <g class="node" style="animation-delay:2.4s">
      <circle cx="1112" cy="240" r="4" fill="#f472b6"/>
    </g>
    <g class="float">
      <text class="mono" x="930" y="82" font-size="11" fill="#7d8ba3">PY</text>
      <text class="mono" x="1092" y="142" font-size="11" fill="#7d8ba3">TS</text>
      <text class="mono" x="960" y="236" font-size="11" fill="#7d8ba3">JAVA</text>
      <text class="mono" x="1196" y="96" font-size="11" fill="#7d8ba3">AI</text>
      <text class="mono" x="1076" y="262" font-size="11" fill="#7d8ba3">SQL</text>
    </g>
    <circle cx="1150" cy="64" r="2" fill="#22d3ee" opacity="0.5"/>
    <circle cx="900" cy="196" r="1.6" fill="#a78bfa" opacity="0.5"/>
    <circle cx="1216" cy="176" r="1.5" fill="#38bdf8" opacity="0.5"/>
    <circle cx="932" cy="60" r="1.3" fill="#e6edf7" opacity="0.35"/>
  </g>

  <line x1="70" y1="290" x2="1210" y2="290" stroke="#1b2536" opacity="0.8"/>
  <rect x="0" y="297" width="1280" height="3" fill="url(#accent)" opacity="0.85"/>
</svg>
