<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" aria-label="GitHub codebase overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1b2536" stroke-width="1" stop-opacity="0.5"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .muted { fill: #7d8ba3; }
      .dim { fill: #4b5769; }
      .ink { fill: #e6edf7; }
      .cyan { fill: #22d3ee; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(4px, -6px); } }
      .fade { animation: fadeUp .9s cubic-bezier(.2,.7,.2,1) both; }
      .grow { transform-origin: left center; animation: growX 1.1s cubic-bezier(.2,.7,.2,1) both; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .drift { animation: drift 7s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .fade, .grow, .pulse, .drift { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="680" height="340" rx="18" fill="url(#bg)"/>
  <rect width="680" height="340" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="679" height="339" rx="17.5" fill="none" stroke="#1b2536"/>
  <ellipse cx="620" cy="28" rx="190" ry="120" fill="url(#glow)"/>
  <ellipse cx="40" cy="320" rx="170" ry="110" fill="url(#glow2)"/>
  <rect x="0" y="0" width="680" height="3" rx="1.5" fill="url(#accent)" opacity="0.9"/>
