name: Refresh README cards

on:
  schedule:
    # 每天 UTC 18:00（北京时间 02:00）刷新一次
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-readme-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate SVG cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python readme_assets/generate_cards.py

      - name: Commit only when the data changed
        run: |
          if git diff --quiet -- readme_assets; then
            echo "No changes, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme_assets/cache.json readme_assets/card-overview.svg readme_assets/card-skills.svg
          git commit -m "chore: refresh README data cards [skip ci]"
          git push
